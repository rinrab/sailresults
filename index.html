<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="white">
    <link rel="manifest" href="/manifest.json">
    <link rel="shortcut icon" href="/favicon.png">
    <link rel="icon" href="/assets/favicon-staging.svg">
    <title>SailResults | Sailing Results Scoring Calculator</title>
    <style>
      @media screen {
        body {
          position: fixed;
          overflow: hidden;
          touch-action: none;
        }

        html, body, #root {
          width: 100%;
          height: 100%;
          margin: 0;
          overflow: hidden;
        }

        .layout {
          height: 100%;
          display: flex;
          flex-direction: column;
        }

        .print-only {
          display: none!important;
        }
      }

      @media print {
        .screen-only {
          display: none!important;
        }

        td, th {
          padding: 4px 8px;
          margin: 0;
          border: black 1px solid;
          height: 40px;
        }

        table {
          border-collapse: collapse;
        }
      }
    </style>
